<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DoseDay – DoseDay</title>
<style>
:root { color-scheme: light dark; --bg: #f2f2f7; --card: #fff; --text: #1c1c1e; --muted: #5c5c5c; --accent: #0b6664; }
@media (prefers-color-scheme: dark) { :root { --bg: #000; --card: #1c1c1e; --text: #f2f2f7; --muted: #b8b8b8; --accent: #3cc2bc; } }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); line-height: 1.6;
       font: 17px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans", sans-serif; }
main { max-width: 760px; margin: 0 auto; padding: 32px 20px 64px; }
nav { display: flex; gap: 20px; flex-wrap: wrap; margin-bottom: 24px; font-weight: 600; }
a { color: var(--accent); }
.card { background: var(--card); border-radius: 16px; padding: 24px; }
h1 { font-size: 28px; line-height: 1.25; margin: 0 0 4px; }
h2 { font-size: 19px; margin: 28px 0 6px; }
.meta { color: var(--muted); margin: 0 0 16px; font-size: 15px; }
.draft { background: #fff4e5; color: #7a4100; border-radius: 10px; padding: 12px 14px; }
@media (prefers-color-scheme: dark) { .draft { background: #3a2a10; color: #ffd8a8; } }
footer { color: var(--muted); font-size: 14px; margin-top: 32px; }
</style>
</head>
<body>
<main>
<nav><a href="">DoseDay</a><a href="privacy/">Privacy Policy</a><a href="terms/">Terms of Service</a><a href="support/">Support</a></nav>
<div class="card">
<h1>DoseDay</h1>
<p class="meta">Medication and activity reminders for iPhone and iPad.</p>
<p><a href="privacy/">Privacy Policy</a></p>
<p><a href="terms/">Terms of Service</a></p>
<p><a href="support/">Support</a></p>
</div>
<footer>© 2026 DoseDay</footer>
</main>
</body>
</html>
